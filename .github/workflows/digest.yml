name: Daily Tech Digest

on:
  # Starts at 22:15 UTC and then waits for the delivery window (see the `wait` job), so the brief
  # lands around 09:15 IST even when GitHub starts the scheduled job hours late.
  schedule:
    - cron: '15 22 * * *'
  # Manual run from the Actions tab: no waiting, runs immediately.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Scheduled runs only. Waits until 03:40 UTC (09:10 IST) when it starts earlier than that, and
  # does not wait when GitHub started it late, so the harvest is fresh and the digest date is right.
  wait:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Wait for the delivery window
        run: |
          mins=$((10#$(date -u +%H) * 60 + 10#$(date -u +%M)))
          target=$((3 * 60 + 40))
          if [ "$mins" -ge $((20 * 60)) ]; then wait=$((24 * 60 - mins + target))
          elif [ "$mins" -lt "$target" ]; then wait=$((target - mins))
          else wait=0; fi
          echo "Started at $(date -u +%H:%M) UTC; waiting $wait minutes."
          sleep $((wait * 60))

  generate-digest:
    needs: wait
    # Run after the wait on schedule, and straight away when the wait job was skipped (manual run).
    if: ${{ !cancelled() && (needs.wait.result == 'success' || needs.wait.result == 'skipped') }}
    # Never run two digests at once; a second run would race on the commit.
    concurrency:
      group: daily-digest
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Require the AI curator key
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY secret is not set. Without it the digest falls back to keyword matching."
            exit 1
          fi

      # Ratings live on the `feedback` branch so they never trigger a redeploy of main.
      - name: Fetch the ratings log
        run: |
          git fetch --depth=1 origin feedback || true
          mkdir -p data
          git show FETCH_HEAD:data/feedback.jsonl > data/feedback.jsonl 2>/dev/null || echo "No ratings yet."

      - name: Generate the digest and email the brief
        env:
          FEEDBACK_SECRET: ${{ secrets.FEEDBACK_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: python scripts/run_daily.py

      # Commit even when the run above exited non-zero: a suspect digest is still history.
      - name: Commit and push digest
        if: always()
        run: |
          git config user.name "TechPulse Bot"
          git config user.email "techpulse-bot@users.noreply.github.com"
          git add digests/
          if git diff --staged --quiet; then
            echo "No new digest to commit."
          else
            git commit -m "Daily digest for $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
