# fly.toml — Fly.io deployment configuration for TechPulse AI Digest Bot
# Free-tier ready with persistent volume mount for SQLite durability.

app = "techpulse-ai-digest"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  RATE_LIMIT_READ = "60/minute"
  RATE_LIMIT_HARVEST = "5/hour"
  HARVEST_COOLDOWN_SECONDS = "600"
  MAX_HARVESTS_PER_HOUR = "4"
  CACHE_TTL_SECONDS = "300"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

# Persistent volume mount preserves SQLite database across deployments & restarts!
# Create volume once with: fly volumes create techpulse_data --size 1
[mounts]
  source = "techpulse_data"
  destination = "/app/data"
