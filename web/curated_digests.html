<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechPulse archive, search every digest</title>
  <meta name="description" content="Search every item TechPulse has kept, by word, topic or next step, and see what your team did about it.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' rx='3' fill='none' stroke='%23f5b942' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>

  <header class="shell-bar">
    <div class="container">
      <a href="/" class="brand-monolith" aria-label="TechPulse, live feed">
        <span class="beacon-pulse" aria-hidden="true"></span>
        <span>TechPulse</span>
      </a>

      <nav class="nav-tabs" aria-label="Main">
        <a href="/" class="nav-tab">Feed</a>
        <a href="/curated-digests" class="nav-tab" aria-current="page">Archive</a>
      </nav>

      <div class="bar-actions">
        <details class="admin-menu" id="admin-menu">
          <summary class="btn" title="Harvest controls">Admin</summary>
          <div class="admin-panel">
            <div class="quota-pill" id="quota-pill" title="Hourly harvest budget">
              <span class="quota-indicator-dot" id="quota-dot" aria-hidden="true"></span>
              <span class="quota-text" id="quota-text">Quota ready</span>
            </div>
            <button type="button" class="btn btn-primary" id="btn-harvest" title="Collect and rank new items now">
              <span>Run harvest</span>
            </button>
          </div>
        </details>
      </div>
    </div>
  </header>

  <main class="app-wrapper container" id="archive" aria-busy="true">

    <div class="page-head">
      <div>
        <h1>Archive</h1>
        <p id="page-sub">Every item the digest has kept, searchable across days.</p>
      </div>
    </div>

    <form class="search-bar" id="search-form" role="search" aria-label="Search the archive">
      <div class="search-wrapper">
        <label class="visually-hidden" for="q">Search every digest</label>
        <input type="search" id="q" name="q" class="field search-input" placeholder="Search every digest: litellm, rust, postgres" autocomplete="off" spellcheck="false">
      </div>
      <label class="visually-hidden" for="topic">Topic</label>
      <select id="topic" class="field"><option value="">Any topic</option></select>
      <label class="visually-hidden" for="step">What to do</label>
      <select id="step" class="field">
        <option value="">Any next step</option>
        <option value="Patch">Patch</option>
        <option value="Try">Try</option>
        <option value="Evaluate">Evaluate</option>
        <option value="Read">Read</option>
        <option value="Watch">Watch</option>
      </select>
    </form>

    <p class="result-meta" id="result-meta" role="status"></p>
    <div id="results" class="cards-grid-view" aria-live="polite"></div>

    <details class="health" id="health">
      <summary>Pipeline health</summary>
      <section class="readings" id="readings" aria-label="Archive readings">
        <div class="skeleton-row" style="grid-column: 1 / -1;"></div>
      </section>
      <section id="history-region" aria-label="Digest history"></section>
      <section id="runs-region" aria-label="Recent runs"></section>
      <div class="split">
        <section id="sources-region" aria-label="Items by source"></section>
        <section id="top-region" aria-label="Top of the latest digest"></section>
      </div>
    </details>

    <p class="wake-note" id="wake-note" hidden>The server is waking from idle. The first load can take about 30 seconds.</p>
  </main>

  <dialog id="key-dialog" aria-labelledby="key-title">
    <form method="dialog">
      <h2 id="key-title">Access key</h2>
      <p class="muted">This server only lets key holders rate items and run a harvest.</p>
      <label>
        API key
        <input type="password" name="key" class="field" autocomplete="off" required>
      </label>
      <div class="row">
        <button type="submit" class="btn" value="cancel" formnovalidate>Cancel</button>
        <button type="submit" class="btn btn-primary" value="ok">Continue</button>
      </div>
    </form>
  </dialog>

  <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

  <script src="/static/shell.js"></script>
  <script src="/static/triage.js"></script>
  <script src="/static/digests.js"></script>
</body>
</html>
