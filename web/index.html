<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechPulse, the daily AI and developer digest</title>
  <meta name="description" content="A ranked daily digest of AI research, open-source projects and developer news, curated and scored from six public sources.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500&family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='2' width='12' height='12' rx='3' fill='none' stroke='%23f5b942' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>

  <header class="shell-bar">
    <div class="container">
      <a href="/" class="brand-monolith" aria-label="TechPulse, live feed">
        <span class="beacon-pulse" aria-hidden="true"></span>
        <span>TechPulse</span>
      </a>

      <nav class="nav-tabs" aria-label="Main">
        <a href="/" class="nav-tab" aria-current="page">Live feed</a>
        <a href="/curated-digests" class="nav-tab">Digests</a>
      </nav>

      <div class="bar-actions">
        <label class="visually-hidden" for="date-select">Digest date</label>
        <select id="date-select" class="field" title="Browse earlier digests">
          <option value="latest">Latest digest</option>
        </select>

        <button type="button" class="btn" id="btn-export" title="Download the shown digest as Markdown">
          <span>Export .md</span>
        </button>

        <div class="keyboard-hint" id="keyboard-hint">
          <kbd>↑</kbd><kbd>↓</kbd><span>move</span><kbd>↵</kbd><span>open</span>
        </div>

        <div class="quota-pill" id="quota-pill" title="Hourly harvest budget">
          <span class="quota-indicator-dot" id="quota-dot" aria-hidden="true"></span>
          <span class="quota-text" id="quota-text">Quota ready</span>
        </div>

        <button type="button" class="btn btn-primary" id="btn-harvest" title="Run a harvest now">
          <span>Run harvest</span>
        </button>
      </div>
    </div>
  </header>

  <main class="app-wrapper container">

    <div class="page-head">
      <div>
        <h1>Today’s digest</h1>
        <p id="page-sub">Loading the latest ranked items.</p>
        <p id="feedback-note"></p>
      </div>
    </div>

    <section class="readings" aria-label="Readings from the shown digest">
      <button type="button" class="reading-cell" id="kpi-card-corpus" title="Show every curated item">
        <span class="reading-label">URLs seen, 30 days</span>
        <span class="reading-value" id="kpi-tracked">--</span>
        <span class="reading-note">after deduplication</span>
      </button>

      <button type="button" class="reading-cell" id="kpi-card-must-read" title="Show must reads only">
        <span class="reading-label">Must read</span>
        <span class="reading-value" id="kpi-must-read">--</span>
        <span class="reading-note" id="kpi-must-note">of the curated set</span>
      </button>

      <button type="button" class="reading-cell" id="kpi-card-inspiration" title="Show inspiration only">
        <span class="reading-label">Inspiration</span>
        <span class="reading-value" id="kpi-inspiration">--</span>
        <span class="reading-note">worth a look</span>
      </button>

      <div class="reading-cell" id="kpi-card-engine">
        <span class="reading-label">Curated by</span>
        <span class="reading-value is-text" id="kpi-engine">--</span>
        <span class="reading-note" id="kpi-latency">ranking backend</span>
      </div>
    </section>

    <section class="control-bar" aria-label="Filters">
      <div class="search-wrapper">
        <label class="visually-hidden" for="search-input">Search the digest</label>
        <input type="search" id="search-input" name="q" class="field search-input" placeholder="Search titles and summaries" autocomplete="off" spellcheck="false">
        <span class="kbd-shortcut"><kbd>Ctrl K</kbd></span>
      </div>

      <div class="filter-group">
        <div class="segmented-control" role="group" aria-label="Category">
          <button type="button" class="seg-btn is-active" data-category="curated" id="tab-curated">
            High signal <span class="tab-badge" id="count-curated">0</span>
          </button>
          <button type="button" class="seg-btn" data-category="Must Read" id="tab-must-read">
            Must read <span class="tab-badge" id="count-must-read">0</span>
          </button>
          <button type="button" class="seg-btn" data-category="Inspiration" id="tab-inspiration">
            Inspiration <span class="tab-badge" id="count-inspiration">0</span>
          </button>
          <button type="button" class="seg-btn muted" data-category="Skip" id="tab-skip" title="Items the curator filtered out">
            Filtered out <span class="tab-badge" id="count-skip">0</span>
          </button>
        </div>

        <div class="view-toggle" role="group" aria-label="Layout">
          <button type="button" class="view-btn is-active" id="view-cards-btn" title="Ranked list">List</button>
          <button type="button" class="view-btn" id="view-cockpit-btn" title="List with a reading pane">Split</button>
        </div>
      </div>
    </section>

    <section class="spectrum-rail" id="spectrum-rail" aria-label="Filter by source"></section>

    <div id="content-container" class="cards-grid-view" role="list" aria-live="polite" aria-busy="true">
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
      <div class="skeleton-row"></div>
    </div>
    <p class="wake-note" id="wake-note" hidden>The server is waking from idle. The first load can take about 30 seconds.</p>
  </main>

  <dialog id="key-dialog" aria-labelledby="key-title">
    <form method="dialog">
      <h2 id="key-title">Access key</h2>
      <p class="muted">This server only lets key holders rate items and run a harvest.</p>
      <label>
        API key
        <input type="password" name="key" class="field" autocomplete="off" required>
      </label>
      <div class="row">
        <button type="submit" class="btn" value="cancel" formnovalidate>Cancel</button>
        <button type="submit" class="btn btn-primary" value="ok">Continue</button>
      </div>
    </form>
  </dialog>

  <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>

  <script src="/static/shell.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
